name: Fork compatibility
on:
  pull_request:
  push:
    branches: [main, codex/upstream-compatibility]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  updater-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_fork_updater.py -v
  protocol-and-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p horizon-protocol -p horizon-shaders --lib
